name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Unit tests (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.9', '3.13']

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Run tests
        run: uv run --python ${{ matrix.python-version }} pytest

  calibre:
    # Proves the bundled wheel imports inside Calibre's own Python and that both
    # the import hook and the manual worker behave, which no virtualenv can show.
    name: Bundled wheel, import hook, manual worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Calibre
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends calibre xvfb
          calibre --version

      - name: Build and install both plugins
        run: |
          python scripts/build_plugin.py --platform linux
          calibre-customize -a dist/interleave_blank_pages-linux.zip
          calibre-customize -a dist/interleave_blank_pages_manual-linux.zip

      - name: Run the Calibre checks
        # Calibre pulls in Qt and expects a display even for headless work.
        run: xvfb-run -a calibre-debug tests/calibre_checks.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

  package:
    name: Package all platforms
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build every platform zip
        run: python scripts/build_plugin.py --platform all

      - uses: actions/upload-artifact@v7
        with:
          name: plugin-zips
          path: dist/*.zip
