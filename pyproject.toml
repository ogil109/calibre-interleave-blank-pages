[project]
name = "calibre-interleave-blank-pages"
version = "0.2.0"
description = "Calibre plugins that write an interleaved copy of your PDFs, with a blank page after each page for handwritten notes."
readme = "README.md"
license = "GPL-3.0-or-later"
authors = [{ name = "ogil109", email = "hello@oscargilbalaguer.com" }]
requires-python = ">=3.9"
keywords = ["calibre", "calibre-plugin", "pdf", "pymupdf", "note-taking"]

# The plugin ships PyMuPDF as a bundled wheel rather than depending on an
# installed copy, so this list stays empty. PyMuPDF appears in the dev group
# below because the test suite needs it.
dependencies = []

[dependency-groups]
dev = [
    "commitizen>=4.10.1",
    # pip is used by scripts/build_plugin.py to fetch the wheels it bundles.
    "pip>=24.0",
    "pymupdf>=1.24",
    "pytest>=8.0",
    "ruff>=0.6",
]

# This project is a Calibre plugin, not an installable Python distribution:
# Calibre loads the plugin from a zip, so there is nothing to build a wheel
# from. uv still manages the virtualenv used for tests and the CLI.
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]

[tool.ruff.format]
# Calibre's own codebase and plugin ecosystem use single quotes.
quote-style = "single"

[tool.commitizen]
# Releases are driven entirely by conventional commits: CI runs `cz bump`,
# which derives the new version from the commits since the last tag, updates
# the files below and the changelog, tags, and the same workflow publishes.
name = "cz_conventional_commits"
version_provider = "pep621"           # read/write [project].version above
version_files = ["shared/version.py:__version__"]
tag_format = "v$version"
update_changelog_on_bump = true
changelog_incremental = true          # prepend the new version; keep history
major_version_zero = true             # stay in 0.x; breaking changes bump the minor
