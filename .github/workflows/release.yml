name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }} zips
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [linux, macos, macos-intel, windows]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Builds both plugins (automatic + manual) for this platform. Wheels are
      # fetched by platform tag rather than built, so every zip can be produced
      # from one runner.
      - name: Build the plugin zips
        run: python scripts/build_plugin.py --platform ${{ matrix.platform }}

      - uses: actions/upload-artifact@v4
        with:
          name: plugins-${{ matrix.platform }}
          path: dist/*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true
          body: |
            Download the zip(s) for your platform, then in Calibre:
            **Preferences → Plugins → Load plugin from file**.

            - `interleave_blank_pages-<platform>.zip` — interleaves every PDF
              you import, automatically.
            - `interleave_blank_pages_manual-<platform>.zip` — adds a toolbar
              action to interleave the books you select, for PDFs already in
              your library.

            Install either or both; they share the same output-folder setting.
            Each zip bundles the PDF library for its platform, so there is
            nothing else to install.
